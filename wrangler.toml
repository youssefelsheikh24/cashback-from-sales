# Cloudflare Pages configuration for the CashBack Sales app.
#
# DB access uses Prisma Accelerate (HTTPS) + Supabase Storage (HTTPS) + Resend
# (HTTPS), so no Node built-ins are required at runtime — nodejs_compat is not
# needed. If you later add a library that needs Node APIs, add "nodejs_compat".
name = "cashback-sales"
compatibility_date = "2024-09-23"

pages_build_output_dir = ".vercel/output/static"

# Build command (set in the Pages dashboard, Build settings):
#   npx @cloudflare/next-on-pages@1
#
# Environment variables / secrets are set in the Cloudflare Pages dashboard
# (Settings → Environment variables), not here. See .env.example for the list.
